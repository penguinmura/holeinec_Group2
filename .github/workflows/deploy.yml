name: Deploy hole-in-EC to AWS EC2

on:
  push:
    branches:
      - vuln-practice  # 演習ブランチ
      - main           # 本番ブランチ
  workflow_dispatch:   # 手動起動

jobs:
  deploy:
    name: Deploy to AWS EC2 via SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

      - name: Deploy via Systems Manager Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "#!/bin/bash",
              "echo \"Starting deploy script...\"",
              "export REPO_DIR=/app",
              "export BRANCH_NAME=${{ github.ref_name }}",
              "",
              "# 1. Git Clone or Update",
              "chown -R ubuntu:ubuntu $REPO_DIR",
              "if [ ! -d \"$REPO_DIR/.git\" ]; then",
              "  echo \"Cloning repository...\"",
              "  rm -rf $REPO_DIR/* $REPO_DIR/.* 2>/dev/null || true",
              "  sudo -u ubuntu git clone -b $BRANCH_NAME https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $REPO_DIR",
              "else",
              "  echo \"Updating repository...\"",
              "  cd $REPO_DIR",
              "  sudo -u ubuntu git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git",
              "  sudo -u ubuntu git fetch origin",
              "  sudo -u ubuntu git checkout -f $BRANCH_NAME",
              "  sudo -u ubuntu git reset --hard origin/$BRANCH_NAME",
              "fi",
              "",
              "# 2. Prisma Database Setup & Seeding",
              "cd $REPO_DIR/server",
              "sudo -u ubuntu npm install",
              "if [ ! -f \".env\" ]; then",
              "  echo '\''DATABASE_URL=\"file:./prisma/dev.db\"'\'' > .env",
              "  chown ubuntu:ubuntu .env",
              "fi",
              "sudo -u ubuntu npx prisma migrate deploy",
              "sudo -u ubuntu npx prisma db seed",
              "",
              "# 3. Build Frontend",
              "cd $REPO_DIR/client",
              "sudo -u ubuntu npm install",
              "sudo -u ubuntu npm run build",
              "",
              "# 4. Start Server via PM2",
              "cd $REPO_DIR/server",
              "sudo -u ubuntu pm2 delete server || true",
              "sudo -u ubuntu pm2 start src/index.js --name \"server\"",
              "sudo -u ubuntu pm2 save",
              "echo \"Deploy finished successfully!\""
            ]' \
            --region ${{ secrets.AWS_REGION || 'ap-northeast-1' }} \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command Sent. ID: $COMMAND_ID"
          echo "Waiting for command execution to complete..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
          
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ secrets.AWS_REGION || 'ap-northeast-1' }} \
            --query "Status" \
            --output text)
          
          echo "SSM Command finished with status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment Failed!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --region ${{ secrets.AWS_REGION || 'ap-northeast-1' }} \
              --query "StandardErrorContent" --output text
            exit 1
          fi
